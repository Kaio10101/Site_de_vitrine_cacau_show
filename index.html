<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cacau Show – Vitrine</title>

<!-- Fontes bonitas do Google (se estiver sem internet, usa Georgia/Arial automaticamente) -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ===== CORES DA PLACA (pode trocar os códigos # se quiser) ===== */
:root{
  --marrom:#7a3b1d;   /* fundo da página */
  --escuro:#4a2312;   /* topo e rodapé */
  --card:#8f4a2a;     /* fundo de cada produto */
  --laranja:#ff7a35;  /* destaques e fundo do círculo da foto */
  --ouro:#ffc23c;     /* título e preços */
  --creme:#fff4e6;    /* texto claro */
  --faixa:rgba(74,35,18,.92); /* topo e rodapé */
}
*{box-sizing:border-box}

/* TAMANHO AUTOMÁTICO: tudo abaixo é medido em "rem", e o rem cresce com a largura
   da tela. Assim a página ocupa a tela inteira e fica legível em celular, monitor ou TV.
   Para deixar TUDO maior ou menor, mude o 1.1vw (ex: 1.3vw = maior, 0.9vw = menor). */
html{font-size:clamp(12px,1.1vw,40px)}

/* Fundo padrão: chocolate com um brilho suave (a imagem do CONFIG, se houver, substitui isto) */
body{margin:0;color:var(--creme);font-family:'Poppins',Arial,sans-serif;min-height:100vh;
     background:radial-gradient(ellipse at 50% 0%,#a0522d 0%,var(--marrom) 45%,#5a2a14 100%) fixed;
     background-size:cover}

/* ===== TOPO ===== */
header{text-align:center;padding:1.6rem 1rem 1.2rem;background:var(--faixa)}
header h1{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:3.2rem;line-height:1.15;color:var(--ouro)}
header p{margin:.4rem 0 0;color:var(--laranja);font-weight:600;font-size:1.4rem}

/* ===== LISTA DE PRODUTOS (ocupa a largura toda; colunas se ajustam sozinhas) ===== */
main{width:100%;padding:1.6rem 2vw}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(22rem,1fr));gap:1.2rem}
.item{display:flex;align-items:center;gap:1.1rem;background:var(--card);
      border-radius:1.4rem;padding:1.1rem;border:2px solid rgba(255,255,255,.1);
      box-shadow:0 .3rem .8rem rgba(0,0,0,.25)}

/* Círculo da foto: mude 7rem para deixar maior ou menor */
.foto{flex:none;width:7rem;height:7rem;border-radius:50%;background:var(--laranja);
      border:.2rem solid var(--escuro);display:grid;place-items:center;font-size:3rem;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}  /* cover = preenche o círculo */

.nome{font-weight:700;font-size:1.45rem;line-height:1.2;white-space:pre-line}
.preco{margin-top:.3rem;font-size:1.8rem;font-weight:700;color:var(--ouro)}
/* pre-line: o "\n" vira quebra de linha */
.preco small{display:block;margin-top:.2rem;font-size:1rem;line-height:1.3;color:var(--creme);font-weight:500;white-space:pre-line}
.consulte{font-size:1.1rem;font-weight:600;opacity:.8}

/* ===== RODAPÉ (Pix + contato) ===== */
footer{display:flex;flex-wrap:wrap;gap:2rem;align-items:center;justify-content:center;
       padding:1.6rem 1rem 2rem;background:var(--faixa);text-align:center}
.pix{display:flex;flex-direction:column;align-items:center;gap:.5rem;font-size:1.1rem}
.qr{width:11rem;height:11rem;border-radius:.8rem;background:#fff;color:var(--escuro);
    display:grid;place-items:center;font-size:1rem;font-weight:600;padding:.5rem;overflow:hidden}
.qr img{width:100%;height:100%;object-fit:contain}
.contato strong{display:block;color:var(--laranja);font-size:1.8rem;margin-bottom:.4rem}
.contato span{font-size:1.7rem;font-weight:700}
</style>
</head>

<body>
<!-- Estrutura da página: os textos são preenchidos pelo script lá embaixo -->
<header>
  <h1 id="titulo"></h1>
  <p id="subtitulo"></p>
</header>

<main><div class="grade" id="grade"></div></main>

<footer>
  <div class="pix">
    <div class="qr" id="qr"></div>
    <b>Pague com o Pix!</b>
  </div>
  <div class="contato">
    <strong id="chamada"></strong>
    <span id="telefone"></span>
  </div>
</footer>

<script>
/* =====================================================================
   ÁREA DE EDIÇÃO – só mexa daqui até a linha "FIM DA ÁREA DE EDIÇÃO"
   ===================================================================== */

/* ---------- 1) TEXTOS GERAIS ---------- */
const CONFIG = {
  titulo:   "Com preços tão baratos, faça um show!",
  subtitulo:"Sua viagem mais doce do que nunca",
  chamada:  "Seu motorista favorito agora é um revendedor Cacau Show!",
  telefone: "chave pix: +55 62 99215-5494",

  // Imagem do QR Code do Pix. Salve na pasta "fotos_cacau_show" e escreva o nome aqui.
  // Exemplo: "fotos_cacau_show/qr-pix.png". Deixe "" (vazio) para mostrar um quadro em branco.
  qrPix: "fotos_qr_codes/qr_code_pix.png",

  // ---------- FUNDO DA PÁGINA ----------
  // Imagem de fundo: salve na pasta "fotos_cacau_show" e escreva o nome aqui.
  // Deixe "" (vazio) para usar o fundo chocolate liso.
  fundo: "fotos_cacau_show/fundo_muitos_doces.jpg",

  // TAMANHO DO FUNDO (só o fundo muda, os produtos continuam do mesmo tamanho):
  //   "contain"  = imagem INTEIRA, o mais "distante" possível (recomendado)
  //   "cover"    = preenche a tela toda, mais "perto" (corta as bordas)
  //   "70%"      = a imagem ocupa 70% da largura da tela (menor = mais distante)
  //   "auto 80%" = a imagem ocupa 80% da altura da tela
  // Teste valores e recarregue a página até gostar.
  fundoTamanho: "cover",

  // Onde a imagem fica na tela: "center", "top", "bottom", "left", "right"
  // (ou combinações, como "center top")
  fundoPosicao: "center",

  // Cor que preenche o que a imagem não cobre (laterais). Esta é a cor rosada
  // da própria imagem, então a emenda quase não aparece.
  fundoCor: "#CA7032"
};

/* ---------- 2) PRODUTOS ----------
   COMO ESCOLHER A FOTO DE UM PRODUTO:
   a) Use a pasta "fotos_cacau_show" ao lado deste arquivo.
   b) Coloque lá a imagem do produto (png, jpg, jpeg, webp, gif ou svg).
   c) Na linha do produto, escreva  foto: "fotos_cacau_show/nome-da-imagem.png"
   Se você não colocar foto (ou a imagem não for encontrada), aparece o emoji.

   CADA PRODUTO TEM:
     nome  – nome que aparece na tela
     preco – só o número, com vírgula (ex: "5,50"). Vazio ("") mostra "Consulte o preço"
     obs   – (opcional) linha extra pequena embaixo do preço
     foto  – (opcional) caminho da imagem, ex: "fotos_cacau_show/tablete20g.png"
     emoji – (opcional) desenho que aparece se não houver foto

   QUEBRA DE LINHA (no nome ou na obs): escreva \n no ponto onde quer quebrar.
   Exemplo:  nome: "Mousse Monte Bello\n90g"   (aparece em duas linhas)

   PARA ADICIONAR: copie uma linha inteira (com a vírgula no final) e altere.
   PARA REMOVER:   apague a linha do produto.
   PARA REORDENAR: mude as linhas de lugar (aparecem na mesma ordem daqui).
   Atenção: toda linha termina com vírgula, menos a última.
*/
const PRODUTOS = [
  { nome: "Tablete 20g",  preco: "5,50",  obs: "Picante, Meio amargo 55%, Ao leite, laranja, Castanha de caju, Mezzo, Genduia, branco, crocante", 
  foto: "fotos_cacau_show/tablete20g.png", emoji: "🍫" },

  { nome: "Tablete 100g",  preco: "22,00", obs: "Ao leite, Mezzo, Genduia, branco", 
  foto: "fotos_cacau_show/tablete100g.webp", emoji: "🍫" },

  { nome: "Tablete 100g\n(Duo Intense, Pistache)",  preco: "24,50", 
  foto: "fotos_cacau_show/tablete_pistache.webp", emoji: "🍫" },
  
  { nome: "Trufa 13,5g",  preco: "4,00",  obs: "Ao leite, branco, mezzo, pistache, meio amargo 70%, genduia", 
  foto: "fotos_cacau_show/trufa13g.png", emoji: "🍬" },
 
  { nome: "Trufa 30g",  preco: "6,50",  obs: "tradicional, branco, mezzo, paçoca, meio amargo(55%), pistache, morango, maracuja, torta de limão", 
  foto: "fotos_cacau_show/trufa30g.png", emoji: "🍬" },

  { nome: "Trufa 30g artesanal",  preco: "7,00",  obs: "limão e frutas vermelhas, petit gateau, licor de cereija", 
  foto: "fotos_cacau_show/trufa_petit_gateau_30g.webp", emoji: "🍬" },

  { nome: "Trufa zero lactose e açúcar 30g ",  preco: "6,50",  obs: "ao leite, branco, morango", 
  foto: "fotos_cacau_show/trufa_zero_morango.webp", emoji: "🍬" },
  
  { nome: "Biscoito 100g",  preco: "20,00", obs: "Tradicional c/ chocolate, canela \nHarry Potter", 
  foto: "fotos_cacau_show/biscoito100g.png", emoji: "🍪" },
  
  { nome: "Bytes 100g",  preco: "20,00", obs: "Amendoim, uva, ao leite crocante, branco, ao leite e branco, 3 chocolates", 
  foto: "fotos_cacau_show/bytes100g.png", emoji: "🍩" },
  
  { nome: "Bombons petit deli 80g",  preco: "21,00", obs: "brownie, pistache", 
  foto: "fotos_cacau_show/bombons_petit_deli80g.webp", emoji: "🍫" },
  
  { nome: "Esfera de Chocolate + miniatura Harry Potter 47g", obs: "possiveis miniaturas: Harry Potter, Hermione, Ron, Hagrid, partes de cenarios", preco: "22,00", 
  foto: "fotos_cacau_show/caixa_harry_potter47g.webp", emoji: "⚡" },
  
  { nome: "Pão de mel 50g",  preco: "12,00",
  foto: "fotos_cacau_show/pao_de_mel50g.webp", emoji: "🧁" },
 
  { nome: "Tablete Miau 70g",  preco: "20,00",  obs: "chocolate ao leite c/ recheio de leite, chocolate ao leite, mezzo", 
  foto: "fotos_cacau_show/tablete_miau70g.webp", emoji: "🐱" },
 
  { nome: "Tablete Dreams 130g",  preco: "26,50",  obs: "morango, maracuja, cookies cream, mil folhas, mil folhas avelã,\nspeeculous: ao leite e branco c/ recheio speeculous", 
  foto: "fotos_cacau_show/tablete_dreams130g.webp", emoji: "🍰" }
];

/* =====================================================================
   FIM DA ÁREA DE EDIÇÃO – daqui para baixo é o "motor" da página.
   Não precisa mexer.
   ===================================================================== */

// Atalho para achar um elemento da página pelo id
const $ = id => document.getElementById(id);

// Atalho para criar um elemento (div, img...) com classe e texto
function criar(tag, classe, texto){
  const e = document.createElement(tag);
  if (classe) e.className = classe;
  if (texto)  e.textContent = texto;
  return e;
}

// Cria uma <img>; se a imagem não existir, chama "aoFalhar" (para mostrar o emoji)
function criarImagem(caminho, alt, aoFalhar){
  const img = criar("img");
  img.src = caminho;
  img.alt = alt;
  img.onerror = () => { img.remove(); if (aoFalhar) aoFalhar(); };
  return img;
}

// ---- Preenche os textos gerais ----
$("titulo").textContent    = CONFIG.titulo;
$("subtitulo").textContent = CONFIG.subtitulo;
$("chamada").textContent   = CONFIG.chamada;
$("telefone").textContent  = CONFIG.telefone;

// ---- Fundo da página ----
document.body.style.backgroundColor = CONFIG.fundoCor;
if (CONFIG.fundo) {
  document.body.style.backgroundImage  = 'url("' + CONFIG.fundo + '")';
  document.body.style.backgroundSize   = CONFIG.fundoTamanho;
  document.body.style.backgroundPosition = CONFIG.fundoPosicao;
  // "auto" repete a imagem como azulejo; os outros modos não repetem
  document.body.style.backgroundRepeat = (CONFIG.fundoTamanho === "auto") ? "repeat" : "no-repeat";
}

// ---- QR Code do Pix ----
if (CONFIG.qrPix) {
  $("qr").appendChild(criarImagem(CONFIG.qrPix, "QR Code Pix",
    () => { $("qr").textContent = "QR Code Pix"; }));
} else {
  $("qr").textContent = "QR Code Pix";
}

// ---- Monta um cartão para cada produto da lista ----
PRODUTOS.forEach(p => {
  const cartao = criar("div", "item");

  // Círculo da foto: mostra a imagem; se não tiver (ou falhar), mostra o emoji
  const circulo = criar("div", "foto");
  const mostrarEmoji = () => { circulo.textContent = p.emoji || "🍫"; };
  if (p.foto) circulo.appendChild(criarImagem(p.foto, p.nome, mostrarEmoji));
  else mostrarEmoji();

  // Nome + preço
  const texto = criar("div");
  texto.appendChild(criar("div", "nome", p.nome));
  if (p.preco) {
    const preco = criar("div", "preco", "R$ " + p.preco);
    if (p.obs) preco.appendChild(criar("small", "", p.obs));
    texto.appendChild(preco);
  } else {
    texto.appendChild(criar("div", "consulte", "Consulte o preço"));
  }

  cartao.append(circulo, texto);
  $("grade").appendChild(cartao);
});
</script>
</body>
</html>
